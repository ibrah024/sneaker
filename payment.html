<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | SoleStreet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">SOLE<span>STREET</span></a>
    <nav><a href="index.html">Home</a><a href="products.html">Sneakers</a><a class="active" href="cart.html">Cart <b id="cartCount">0</b></a></nav>
  </header>

  <main class="section checkout">
    <div class="page-heading"><p class="eyebrow">SECURE CHECKOUT</p><h1>Payment Details</h1></div>
    <div class="checkout-layout">
      <form id="paymentForm" class="payment-form" novalidate>
        <h2>Delivery & Payment</h2>
        <label>Full Name<input id="name" type="text" placeholder="Your full name"></label>
        <label>Email<input id="email" type="email" placeholder="you@example.com"></label>
        <label>Phone Number<input id="phone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" maxlength="10"></label>
        <label>Delivery Address<textarea id="address" rows="3" placeholder="House no., street, city"></textarea></label>
        <div class="form-row">
          <label>Card Number<input id="card" type="text" inputmode="numeric" placeholder="16-digit card number" maxlength="19"></label>
          <label>Expiry<input id="expiry" type="text" placeholder="MM/YY" maxlength="5"></label>
        </div>
        <div class="form-row">
          <label>CVV<input id="cvv" type="password" inputmode="numeric" placeholder="3 digits" maxlength="3"></label>
          <label>PIN Code<input id="pin" type="text" inputmode="numeric" placeholder="6 digits" maxlength="6"></label>
        </div>
        <p id="formError" class="error"></p>
        <button class="btn full" type="submit">PLACE ORDER</button>
      </form>
      <aside id="orderSummary" class="summary"></aside>
    </div>
  </main>

  <footer><p>© 2026 SoleStreet. College TW–1 Project.</p></footer>
  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
